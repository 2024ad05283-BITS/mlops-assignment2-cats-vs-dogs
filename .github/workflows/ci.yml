name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  build-test-docker:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pytest


      # ======================================================
      # 4. Unit Tests
      # ======================================================

      - name: Run Unit Tests
        run: |

          pytest -v


      # ======================================================
      # 5. Build Docker Image
      # ======================================================

      - name: Build Docker Image
        run: |

          docker build \
            -f docker/Dockerfile \
            -t cats-vs-dogs-api:ci \
            .


      # ======================================================
      # 6. Docker Hub Login
      # Only on push, NOT pull request
      # ======================================================

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:

          username: ${{ secrets.DOCKER_USERNAME }}

          password: ${{ secrets.DOCKER_PASSWORD }}


      # ======================================================
      # 7. Push Docker Image
      # Only on push
      # ======================================================

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |

          docker tag \
            cats-vs-dogs-api:ci \
            ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-api:latest

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-api:latest